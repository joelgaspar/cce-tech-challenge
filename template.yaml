AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MAN Digital Hub - CCE tech challenge.
  HTTP API ingesting JSON items into DynamoDB.

Parameters:
  ProjectName:
    Type: String
    Default: cce-tech-challenge
    Description: Prefix used for resource names.
  CodeBucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda zip artifacts.
  IngestCodeKey:
    Type: String
    Description: S3 key of the ingest Lambda zip artifact.

Resources:
  # ---------------------------------------------------------------------
  # Data store
  # ---------------------------------------------------------------------
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-items"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------
  # Ingest Lambda (POST /items)
  # ---------------------------------------------------------------------
  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ingest-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dynamodb-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ItemsTable.Arn

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ingest"
      Runtime: python3.12
      Handler: ingest_handler.handler
      Role: !GetAtt IngestFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref IngestCodeKey
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable

  IngestFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

  # ---------------------------------------------------------------------
  # HTTP API
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP

  IngestIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestFunction.Arn
      PayloadFormatVersion: "2.0"

  ItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /items"
      Target: !Sub "integrations/${IngestIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  IngestApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/items"

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API. POST JSON to <ApiEndpoint>/items
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ItemsTableName:
    Value: !Ref ItemsTable
